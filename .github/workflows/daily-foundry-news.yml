name: Daily Microsoft Foundry News

# Runs entirely on GitHub-hosted cloud runners — no local machine required.
on:
  schedule:
    # 08:00 UTC every day. Cron in GitHub Actions is always UTC.
    - cron: "0 8 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write   # commit & push the generated digests
  models: read      # per-news explanations via GitHub Models

concurrency:
  group: daily-foundry-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate news digests
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWS_EXPLAINER_AGENT: Microsoft Foundry News Explainer
        run: python scripts/generate_foundry_news.py

      - name: Commit and push digests
        env:
          FILES: ${{ steps.gen.outputs.files }}
          DIGEST_DATE: ${{ steps.gen.outputs.date }}
          HAS_NEWS: ${{ steps.gen.outputs.has_news }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in $FILES; do
            git add "$file"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          if [ "$HAS_NEWS" = "true" ]; then
            MSG="Add Microsoft Foundry news digests for ${DIGEST_DATE}"
          else
            MSG="Add Microsoft Foundry no-news digests for ${DIGEST_DATE}"
          fi
          git commit -m "$MSG" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:${GITHUB_REF_NAME}
